<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Decoder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #02060c;
    --cyan: #38e1ff;
    --cyan-soft: rgba(56, 225, 255, .35);
    --cyan-faint: rgba(56, 225, 255, .12);
    --panel: rgba(6, 16, 26, .92);
    --text: #d8f6ff;
    --muted: #7fa9b8;
    --ok: #39ffb0;
    --bad: #ff4d6a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Chakra Petch", system-ui, sans-serif;
    overflow-x: hidden;
  }
  canvas#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .beam {
    position: fixed; top: 0; bottom: 0; left: 50%; width: 140px; transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(56,225,255,.28), rgba(56,225,255,.06) 40%, transparent 70%);
    filter: blur(8px); z-index: 0; pointer-events: none;
  }
  .beam::after {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%);
    background: linear-gradient(transparent, rgba(160,240,255,.8), transparent);
  }

  main {
    position: relative; z-index: 1; min-height: 100%;
    display: grid; place-items: center; padding: 32px 16px;
  }

  /* HUD frame: octagon with glowing edge */
  .hud { width: min(600px, 100%); position: relative; filter: drop-shadow(0 0 18px rgba(56,225,255,.35)); }
  .hud-edge {
    --cut: 28px;
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    background: linear-gradient(160deg, #3a5566, #10202b 40%, #2c4555);
    padding: 3px;
  }
  .hud-inner {
    --cut: 26px;
    clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut));
    background:
      radial-gradient(ellipse at 50% 30%, rgba(56,225,255,.10), transparent 60%),
      var(--panel);
    padding: 28px 36px 34px;
    position: relative;
  }
  .hud-inner::before { /* thin inner cyan outline */
    content: ""; position: absolute; inset: 10px; border: 1px solid var(--cyan-faint); pointer-events: none;
    clip-path: inherit;
  }
  /* glowing accent bars on the frame */
  .bar { position: absolute; background: var(--cyan); box-shadow: 0 0 10px var(--cyan), 0 0 20px var(--cyan-soft); border-radius: 2px; }
  .bar.t { top: -1px; left: 50%; width: 30%; height: 4px; transform: translateX(-50%); }
  .bar.b { bottom: -1px; left: 50%; width: 30%; height: 4px; transform: translateX(-50%); }
  .bar.l { left: -1px; top: 50%; height: 26%; width: 4px; transform: translateY(-50%); }
  .bar.r { right: -1px; top: 50%; height: 26%; width: 4px; transform: translateY(-50%); }
  .bar.tl { top: 14px; left: 2px; width: 32px; height: 3px; transform: rotate(-45deg); transform-origin: left; }
  .bar.tr { top: 14px; right: 2px; width: 32px; height: 3px; transform: rotate(45deg); transform-origin: right; }
  .bar.bl { bottom: 14px; left: 2px; width: 32px; height: 3px; transform: rotate(45deg); transform-origin: left; }
  .bar.br { bottom: 14px; right: 2px; width: 32px; height: 3px; transform: rotate(-45deg); transform-origin: right; }

  .emblem { display: block; width: 100%; max-width: 420px; height: auto; margin: 0 auto; }
  .lock-shackle { transition: transform .6s cubic-bezier(.5,-0.4,.3,1.4); transform-origin: 160px 62px; }
  .unlocked .lock-shackle { transform: translateY(-14px) rotate(-18deg); }
  .core { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .55; } }

  h1 {
    text-align: center; margin: 6px 0 2px; font-weight: 500; font-size: clamp(18px, 4.4vw, 24px);
    letter-spacing: .04em; color: #bff3ff; text-shadow: 0 0 12px rgba(56,225,255,.6);
  }
  .sub { text-align: center; margin: 0 0 24px; color: var(--muted); font-size: 15px; }

  form { display: grid; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
  label small { text-transform: none; letter-spacing: 0; color: var(--muted); font-size: 13px; }
  input {
    width: 100%; font: inherit; font-size: 18px; color: var(--text); letter-spacing: .02em;
    background: rgba(2, 10, 18, .85); border: 1px solid rgba(56,225,255,.3); border-radius: 4px;
    padding: 12px 14px; outline: none; transition: border-color .2s, box-shadow .2s;
  }
  input::placeholder { color: #3f6070; }
  input:focus { border-color: var(--cyan); box-shadow: 0 0 0 3px rgba(56,225,255,.15), 0 0 16px rgba(56,225,255,.25); }
  #code { text-transform: uppercase; font-weight: 600; letter-spacing: .1em; }

  button.go {
    margin-top: 6px; font: inherit; font-size: 18px; font-weight: 700; letter-spacing: .18em;
    color: #02121a; background: linear-gradient(180deg, #7aeeff, #1cc7ec); border: 0; border-radius: 4px;
    padding: 14px; cursor: pointer; box-shadow: 0 0 18px rgba(56,225,255,.45);
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    transition: filter .15s, transform .1s;
  }
  button.go:hover { filter: brightness(1.12); }
  button.go:active { transform: translateY(1px); }
  button.go:disabled { filter: grayscale(.6) brightness(.7); cursor: wait; }

  /* Popup */
  .overlay {
    position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; padding: 16px;
    background: rgba(0, 4, 8, .78); backdrop-filter: blur(4px);
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .overlay.show { opacity: 1; pointer-events: auto; }
  .pop {
    --c: var(--ok);
    width: min(460px, 100%); text-align: center; padding: 30px 26px 26px;
    background: rgba(4, 14, 22, .97); border: 2px solid var(--c); border-radius: 6px;
    box-shadow: 0 0 30px color-mix(in srgb, var(--c) 45%, transparent), inset 0 0 30px color-mix(in srgb, var(--c) 12%, transparent);
    transform: scale(.85); transition: transform .25s cubic-bezier(.3,1.6,.5,1);
  }
  .overlay.show .pop { transform: scale(1); }
  .pop.bad { --c: var(--bad); }
  .overlay.show .pop.bad { animation: shake .45s; }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .pop .icon { width: 84px; height: 84px; margin: 0 auto 10px; color: var(--c); filter: drop-shadow(0 0 10px var(--c)); }
  .pop .tag { font-size: 13px; letter-spacing: .3em; color: var(--c); margin: 0; }
  .pop h2 { margin: 4px 0 8px; font-size: 34px; color: var(--c); text-shadow: 0 0 14px var(--c); }
  .pop p.msg { margin: 0 0 22px; color: var(--text); font-size: 17px; line-height: 1.5; }
  .pop button {
    font: inherit; font-size: 16px; font-weight: 600; letter-spacing: .1em; cursor: pointer;
    color: var(--c); background: transparent; border: 1px solid var(--c); border-radius: 4px; padding: 10px 28px;
  }
  .pop button:focus { outline: none; }
  .pop button:focus-visible { outline: 2px solid var(--c); outline-offset: 3px; }
  .pop button:hover { background: color-mix(in srgb, var(--c) 15%, transparent); }

  @media (max-width: 480px) {
    .hud-inner { padding: 22px 20px 26px; }
    .hud-edge { --cut: 18px; } .hud-inner { --cut: 16px; }
    .bar.tl, .bar.tr, .bar.bl, .bar.br { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .core, .overlay.show .pop.bad { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<div class="beam" aria-hidden="true"></div>

<main>
  <section class="hud" aria-labelledby="title">
    <span class="bar t"></span><span class="bar b"></span><span class="bar l"></span><span class="bar r"></span>
    <span class="bar tl"></span><span class="bar tr"></span><span class="bar bl"></span><span class="bar br"></span>
    <div class="hud-edge"><div class="hud-inner">

      <!-- Lock emblem with circuit traces -->
      <svg class="emblem" id="emblem" viewBox="0 0 320 170" aria-hidden="true">
        <defs>
          <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#e9f1f4"/><stop offset=".5" stop-color="#a9b9c1"/><stop offset="1" stop-color="#6f8590"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>
        <g stroke="#38e1ff" stroke-width="1.3" fill="none" filter="url(#glow)" opacity=".9">
          <!-- left traces -->
          <path d="M118 96 H92 L80 84 H40"/><path d="M118 104 H70 L60 94 H18"/><path d="M118 112 H86 L74 124 H30"/>
          <path d="M118 120 H100 L90 130 H52"/><path d="M118 88 H104 L96 76 H62"/><path d="M118 128 H96 L88 140 H70"/>
          <!-- right traces -->
          <path d="M202 96 H228 L240 84 H280"/><path d="M202 104 H250 L260 94 H302"/><path d="M202 112 H234 L246 124 H290"/>
          <path d="M202 120 H220 L230 130 H268"/><path d="M202 88 H216 L224 76 H258"/><path d="M202 128 H224 L232 140 H250"/>
          <!-- top traces -->
          <path d="M140 40 V18 L132 10"/><path d="M152 36 V6"/><path d="M168 36 V6"/><path d="M180 40 V18 L188 10"/>
        </g>
        <g fill="#38e1ff" filter="url(#glow)">
          <circle cx="40" cy="84" r="2.4"/><circle cx="18" cy="94" r="2.4"/><circle cx="30" cy="124" r="2.4"/><circle cx="52" cy="130" r="2.4"/><circle cx="62" cy="76" r="2.4"/><circle cx="70" cy="140" r="2.4"/>
          <circle cx="280" cy="84" r="2.4"/><circle cx="302" cy="94" r="2.4"/><circle cx="290" cy="124" r="2.4"/><circle cx="268" cy="130" r="2.4"/><circle cx="258" cy="76" r="2.4"/><circle cx="250" cy="140" r="2.4"/>
          <circle cx="132" cy="10" r="2.4"/><circle cx="152" cy="6" r="2.4"/><circle cx="168" cy="6" r="2.4"/><circle cx="188" cy="10" r="2.4"/>
        </g>
        <!-- shackle -->
        <path class="lock-shackle" d="M134 82 V60 a26 26 0 0 1 52 0 V82" fill="none" stroke="url(#metal)" stroke-width="12" stroke-linecap="round"/>
        <!-- body -->
        <rect x="118" y="78" width="84" height="74" rx="10" fill="url(#metal)" stroke="#d9e6ec" stroke-width="1"/>
        <path d="M160 78 V152 M118 115 H202" stroke="#7d929c" stroke-width="1" opacity=".6"/>
        <!-- glowing core -->
        <circle cx="160" cy="115" r="17" fill="#0a2330" stroke="#38e1ff" stroke-width="3" filter="url(#glow)" class="core"/>
        <circle cx="160" cy="115" r="9" fill="none" stroke="#7ff0ff" stroke-width="2.5" filter="url(#glow)" class="core"/>
        <path d="M160 106 V115" stroke="#c9f9ff" stroke-width="2.5" stroke-linecap="round"/>
      </svg>

      <h1 id="title">Agent Password Protection System</h1>
      <p class="sub">ภารกิจซองลับ Agent ถอดรหัส</p>

      <form id="f" autocomplete="off" novalidate>
        <label>Agent Code <small>รหัส Agent ที่หน้าซอง เช่น ABCDE-00</small>
          <input id="code" name="code" required spellcheck="false" placeholder="XXXXX-00" autocapitalize="characters">
        </label>
        <label>Secret Code <small>ประโยคลับที่ถอดรหัสได้ (เว้นวรรคหรือไม่เว้นก็ได้)</small>
          <input id="secret" name="secret" required spellcheck="false" placeholder="พิมพ์ประโยคลับ">
        </label>
        <button class="go" type="submit" id="go">ถอดรหัส · DECRYPT</button>
      </form>
    </div></div>
  </section>
</main>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-labelledby="popTitle">
  <div class="pop" id="pop">
    <svg class="icon" id="popIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
    <p class="tag" id="popTag"></p>
    <h2 id="popTitle"></h2>
    <p class="msg" id="popMsg"></p>
    <button type="button" id="popClose">ตกลง</button>
  </div>
</div>

<script>
// SHA-256 of  UPPER(agentCode) + "|" + sentence  with all whitespace removed (NFC).
// Only hashes are stored so students can't read the answers from the page source.
const ANSWERS = new Set([
  "c23ca945ed44bd2beaa56d5044f1e3334a23887d953565a82c02b784b95e6f49",
  "093c6d3dbf10f301135b648973929fbcb9abd781654d316d7ef7083f2bf79993",
  "4311543fa2cc26cb664d65a5a2e192a84d171c641bf0a660b15f383de54f7400",
  "024efeed6f1bc89c9c26ee20bd6c869d8451eabef543e3bdc74dbd328bdb60cb",
  "e221431e9c32b354190b5782520544706c16a62f98252f84d8d000427b160bee",
  "2aeb0be6d4012a24cd2a13afab7b9a8c9d9a8b09d06bed08e4c06c282d1d6d87",
  "883e719b9d77eb9c5cbcb98e2109c0700c3238a06fcd8e33de740ce0de873c7c",
  "ef686f5e3d5a82deeb19a440923dc52772e0dc1c2852c4c8ae2fca3363a29df5",
  "b540a625b33db0cd2a6ebab5e7221eaf69f909a3a26aa63548954fa678e658db",
  "ec3c33c2c1851c19462f82053d2f8a09bde05473ef477c60996370548ffa829e",
  "c50f6cdbb06cf0bb9db4acc8ce14f6553b85a8b80637895ff15e85518a2c1777",
  "a9ff3c69397aa8fd9742d89e3755f37c1e89088e80088475d11157117eac3355",
  "16512542e2dff0d7281373f48d65572ab0812e29024cf844a9f0ce6e565adedd",
  "1226a7ede63c208b2e1749ad6957fbc5d9badab91385066643d6f4f65ab58b87",
  "8f4c6857923b1aca3596682cfd6b1be279c1bb8d2e9fd58b27ed6dfb3dd31b80"
]);

const norm = s => s.normalize("NFC").replace(/[\s​‌‍﻿]+/g, "");

async function sha256(text) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}

const $ = id => document.getElementById(id);
const form = $("f"), codeIn = $("code"), secretIn = $("secret");

const ICONS = {
  ok:  '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 7.5-2"/><path d="M9 16l2 2 4-4"/>',
  bad: '<rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/><path d="M10 14l4 4M14 14l-4 4"/>'
};

function showPopup(ok, code) {
  $("pop").className = "pop" + (ok ? "" : " bad");
  $("popIcon").innerHTML = ok ? ICONS.ok : ICONS.bad;
  $("popTag").textContent = ok ? "ACCESS GRANTED" : "ACCESS DENIED";
  $("popTitle").textContent = ok ? "ถูกต้อง!" : "ไม่ถูกต้อง";
  $("popMsg").textContent = ok
    ? `ภารกิจสำเร็จ! Agent ${code} ถอดรหัสได้ถูกต้อง`
    : "รหัส Agent หรือประโยคลับยังไม่ถูกต้อง กลับไปตรวจคำตอบแล้วลองใหม่";
  $("emblem").classList.toggle("unlocked", ok);
  $("overlay").classList.add("show");
  $("popClose").focus();
}

function closePopup() {
  $("overlay").classList.remove("show");
  $("emblem").classList.remove("unlocked");
  form.reset(); codeIn.focus();   // always clear for the next team
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  const code = norm(codeIn.value).toUpperCase();
  const secret = norm(secretIn.value);
  if (!code) { codeIn.focus(); return; }
  if (!secret) { secretIn.focus(); return; }
  $("go").disabled = true;
  try {
    const ok = ANSWERS.has(await sha256(code + "|" + secret));
    showPopup(ok, code);
  } catch (err) {
    alert("เบราว์เซอร์นี้ตรวจรหัสไม่ได้ กรุณาเปิดผ่าน https (GitHub Pages)");
  } finally {
    $("go").disabled = false;
  }
});

$("popClose").addEventListener("click", closePopup);
$("overlay").addEventListener("click", e => { if (e.target.id === "overlay") closePopup(); });
document.addEventListener("keydown", e => {
  if ($("overlay").classList.contains("show") && (e.key === "Escape" || e.key === "Enter")) { e.preventDefault(); closePopup(); }
});

// Background: data streaks radiating from the center + faint helix strands
(() => {
  const cv = $("bg"), ctx = cv.getContext("2d");
  const still = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w, h, dpr, streaks = [];
  function resize() {
    dpr = Math.min(devicePixelRatio || 1, 2);
    w = innerWidth; h = innerHeight;
    cv.width = w * dpr; cv.height = h * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    streaks = Array.from({ length: Math.round((w * h) / 9000) }, spawn);
  }
  function spawn() {
    const a = Math.random() * Math.PI * 2;
    return { a, d: Math.random() * Math.max(w, h) * .7, v: .6 + Math.random() * 2.4, len: 6 + Math.random() * 40, o: .15 + Math.random() * .6 };
  }
  let t = 0;
  function frame() {
    t += 0.008;
    ctx.fillStyle = "rgba(2,6,12,.35)"; ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    // streaks
    for (const s of streaks) {
      s.d += s.v * (1 + s.d / 300);
      if (s.d > Math.max(w, h)) Object.assign(s, spawn(), { d: 20 + Math.random() * 80 });
      const c = Math.cos(s.a), si = Math.sin(s.a);
      ctx.strokeStyle = `rgba(120,220,255,${s.o})`; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(cx + c * s.d, cy + si * s.d); ctx.lineTo(cx + c * (s.d + s.len), cy + si * (s.d + s.len)); ctx.stroke();
    }
    // helix strands along the vertical beam
    for (let k = 0; k < 3; k++) {
      ctx.strokeStyle = `rgba(150,215,240,${.10 + k * .04})`; ctx.lineWidth = 1.2;
      ctx.beginPath();
      for (let y = 0; y <= h; y += 6) {
        const x = cx + Math.sin(y / (90 + k * 30) + t * (1 + k * .3) + k * 2) * (40 + k * 26) * Math.sin(y / h * Math.PI + .2);
        y ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    if (!still) requestAnimationFrame(frame);
  }
  addEventListener("resize", resize);
  resize();
  ctx.fillStyle = "#02060c"; ctx.fillRect(0, 0, w, h);
  if (still) { for (let i = 0; i < 40; i++) frame(); } else requestAnimationFrame(frame);
})();
</script>
</body>
</html>
